[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/ipc",
    "crates/telemetry",
    "crates/telemetry-helper-protocol",
    "crates/network",
    "crates/network-helper-protocol",
    "crates/usage",
    "crates/remote-core",
    "crates/remote-ssh",
    "crates/remote-ftp",
    "crates/remote-smb",
    "crates/transfers",
    "crates/notes",
    "crates/systeminfo",
    "bins/appd",
    "bins/telemetry-helper",
    "bins/network-helper",
    "apps/desktop-ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
base64 = "=0.22.1"
bytes = "=1.12.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
curl = { version = "=0.4.50", default-features = false }
curl-sys = { version = "=0.4.90", default-features = false }
futures-core = "=0.3.33"
libc = "=0.2.189"
libbpf-cargo = { version = "=0.27.0", default-features = false }
libbpf-rs = { version = "=0.27.0", default-features = false }
libloading = "=0.8.9"
localdesk-domain = { path = "crates/domain" }
localdesk-ipc = { path = "crates/ipc" }
localdesk-network = { path = "crates/network" }
localdesk-network-helper-protocol = { path = "crates/network-helper-protocol" }
localdesk-notes = { path = "crates/notes" }
localdesk-remote-core = { path = "crates/remote-core" }
localdesk-remote-ftp = { path = "crates/remote-ftp" }
localdesk-remote-smb = { path = "crates/remote-smb" }
localdesk-remote-ssh = { path = "crates/remote-ssh" }
localdesk-telemetry = { path = "crates/telemetry" }
localdesk-telemetry-helper-protocol = { path = "crates/telemetry-helper-protocol" }
localdesk-systeminfo = { path = "crates/systeminfo" }
localdesk-transfers = { path = "crates/transfers" }
localdesk-usage = { path = "crates/usage" }
nix = { version = "=0.31.3", features = ["socket", "user", "feature", "fs"] }
openssh-sftp-client = { version = "=0.15.7", default-features = false }
rusqlite = { version = "=0.40.1", default-features = false, features = ["libsqlite3-sys"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
tauri-build = "=2.6.3"
tauri-plugin-dialog = { version = "=2.7.1", default-features = false, features = ["xdg-portal"] }
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.18", features = ["codec"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "=1.23.4", features = ["serde", "v4"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
